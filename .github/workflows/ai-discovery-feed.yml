# ONE-TIME PUBLIC SERVER SETUP — this is not the APK build workflow.
# Destination: snowball-ai-feed/.github/workflows/ai-discovery-feed.yml
# Contains public-only collector source and tests. Does not access user portfolio.
name: Snowball public AI research feed
on:
  push:
    paths:
      - '.github/workflows/ai-discovery-feed.yml'
  workflow_dispatch:
  schedule:
    # 08:00 / 13:00 / 19:00 KST
    - cron: '0 23,4,10 * * *'
permissions:
  contents: write
concurrency:
  group: snowball-public-ai-feed
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public AI feed repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm this feed repository is public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')
          if [ "$private" != "false" ]; then
            echo '::error::The feed repository is private; the Android app cannot fetch public raw JSON.'
            exit 1
          fi
