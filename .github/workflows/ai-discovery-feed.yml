      - name: Check server collector (14 offline tests)
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_server_registry_v338.py
          for t in v333_collector v334_official v335_tracks v336_published_feed v337_market_daily v337_feed v337_integration v338_flow_reuse v338_full_integration v339_candidate_gate v340_preliminary v341_preliminary v342_source_quality v344_publish_contract; do
            python "tools/test_${t}.py"
          done
      - name: Collect current public evidence
        id: collect
        continue-on-error: true
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SNOWBALL_FLOW_PUBLICATION_APPROVED: ${{ vars.SNOWBALL_FLOW_PUBLICATION_APPROVED }}
        run: |
          set -euo pipefail
          python automation/ai_discovery_collector.py
      - name: Validate output and detect stale/malformed data
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_v338_published_feed.py docs/ai_discovery_feed.json
          python - <<'PYHEALTH'
          import json,datetime
          d=json.load(open('docs/ai_discovery_feed.json',encoding='utf-8'))
          assert d.get('status') in {'ok','partial','error'}
          print('FEED STATUS:',d['status'], 'generatedAt:',d['generatedAt'],
                'scanned:',d['scanned'],'completed:',d['completed'],
                'observedThemes:',d.get('publicationHealth',{}).get('observedThemes'),
                'preliminaryMedia:',d.get('publicationHealth',{}).get('preliminaryMedia'),
                'preliminaryAI:',d.get('publicationHealth',{}).get('preliminaryAI'))
          PYHEALTH
      - name: Publish public feed JSON to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'snowball-feed-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai_discovery_feed.json docs/ai_discovery_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Snowball AI research feed'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Fail visibly if every news source was unavailable
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'The collector could not access any news sources. Published error status, not empty recommendations.'
          exit 1
