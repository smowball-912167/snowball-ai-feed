      # Server repo does not contain the Android app, master guide, or private signing keys.
      # Do not run check_collector_reuse.py or Android JS tests here.
      - name: Verify server-only network ownership
        run: python tools/check_server_registry_v338.py
      - name: Run server-only collector and safety tests
        run: |
          python tools/test_v333_collector.py
          python tools/test_v334_official.py
          python tools/test_v335_tracks.py
          python tools/test_v336_published_feed.py
          python tools/test_v337_market_daily.py
          python tools/test_v337_feed.py
          python tools/test_v337_integration.py
          python tools/test_v338_flow_reuse.py
          python tools/test_v338_full_integration.py
          python tools/test_v339_candidate_gate.py
          python tools/test_v340_preliminary.py
          python tools/test_v341_preliminary.py
          python tools/test_v342_source_quality.py
          python tools/test_v344_publish_contract.py
          python tools/test_v361_theme_rank.py
          python tools/test_v363_theme_transport.py
          python tools/test_v366_price_watch.py
          python tools/test_v367_live_contract.py
      - name: Restore optional approved public-only flow summary
        env:
          SNOWBALL_LEGACY_FLOW_B64: ${{ secrets.SNOWBALL_LEGACY_FLOW_B64 }}
        run: |
          mkdir -p private_input
          if test -n "$SNOWBALL_LEGACY_FLOW_B64"; then
            printf '%s' "$SNOWBALL_LEGACY_FLOW_B64" | base64 --decode > private_input/legacy_flow_summary.json
            test "$(wc -c < private_input/legacy_flow_summary.json)" -le 150000
          fi
      - name: Collect public evidence and preliminary candidates
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SNOWBALL_FLOW_PUBLICATION_APPROVED: ${{ vars.SNOWBALL_FLOW_PUBLICATION_APPROVED }}
        run: python automation/ai_discovery_collector.py
      - name: Validate public output (unverified watches only)
        run: |
          python tools/validate_v338_published_feed.py docs/ai_discovery_feed.json
          python tools/validate_v367_live_contract.py docs/ai_discovery_feed.json
      - name: Save diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowball-public-feed-snapshot
          path: docs/ai_discovery_feed.json
          retention-days: 14
          if-no-files-found: warn
      - name: Publish public feed and non-personal scan history
        run: |
          git config user.name 'snowball-feed-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ai_discovery_feed.json docs/ai_discovery_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update AI public research feed'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Fail if all source requests failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
